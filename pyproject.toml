[project]
name = "spreadboard-public"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
  "aiohttp>=3.14.3",
  "ccxt>=4.4.0",
  "click>=8.1",
  "cryptography>=50.0",
  "orjson>=3.11.9",
  "protobuf==5.29.6",
  "pywebpush>=2.0.3",
  "segno>=1.6.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["spreadboard", "src/spreadarb"]
