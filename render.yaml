services:
  - type: web
    name: spreadboard-public
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    autoDeployTrigger: commit
    envVars:
      - key: SPREADBOARD_PUBLIC_MODE
        value: "1"
      - key: SPREADBOARD_REFRESH_SECONDS
        value: "600"
      - key: SPREADBOARD_FAST_QUOTE_SECONDS
        value: "30"
      - key: SPREADBOARD_FAST_QUOTE_ROUTES
        value: "16"
      - key: SPREADBOARD_FAST_QUOTE_TIMEOUT_SECONDS
        value: "90"
      - key: SPREADBOARD_CHART_SAMPLE_SECONDS
        value: "5"
      - key: SPREADBOARD_CHART_SAMPLE_TIMEOUT_SECONDS
        value: "22"
      - key: SPREADBOARD_CHART_SAMPLE_CONCURRENCY
        value: "2"
      - key: SPREADBOARD_DATA_DIR
        value: /app/runtime
      - key: SPREADBOARD_LIGHTWEIGHT_MODE
        value: "1"
      - key: SPREADBOARD_CEX_CANDIDATES
        value: "80"
      - key: SPREADBOARD_DEX_CANDIDATES
        value: "40"
      - key: SPREADBOARD_FUNDING_HISTORY_WORKERS
        value: "4"
      - key: SPREADBOARD_REFRESH_TIMEOUT_SECONDS
        value: "900"
      - key: SPREADBOARD_NATIVE_FUNDING_ONLY
        value: "1"
      - key: SPREADARB_MAX_ENTRY_SPREAD_PCT
        value: "0"
      - key: SPREADARB_OKX_DEX_API_KEY
        sync: false
      - key: SPREADARB_OKX_DEX_SECRET
        sync: false
      - key: SPREADARB_OKX_DEX_PASSPHRASE
        sync: false
      - key: SPREADARB_OKX_DEX_PROJECT_ID
        sync: false
