services:
  - type: web
    name: spreadboard-public
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    autoDeployTrigger: commit
    envVars:
      - key: SPREADBOARD_PUBLIC_MODE
        value: "1"
      - key: SPREADBOARD_REFRESH_SECONDS
        value: "300"
      - key: SPREADBOARD_DATA_DIR
        value: /app/runtime
      - key: SPREADBOARD_LIGHTWEIGHT_MODE
        value: "1"
      - key: SPREADBOARD_CEX_CANDIDATES
        value: "80"
      - key: SPREADBOARD_DEX_CANDIDATES
        value: "40"
      - key: SPREADBOARD_FUNDING_HISTORY_WORKERS
        value: "4"
      - key: SPREADBOARD_REFRESH_TIMEOUT_SECONDS
        value: "900"
      - key: SPREADBOARD_NATIVE_FUNDING_ONLY
        value: "1"
