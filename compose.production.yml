services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - ${SPREADBOARD_ENV_FILE:-/opt/spreadboard/secrets/app.env}
    environment: &spreadboard_runtime_environment
      HOST: 0.0.0.0
      PORT: "8200"
      # Each structural generation allocates and frees ~0.66GB of row dicts on
      # worker threads.  glibc keeps a per-thread arena for that churn and does
      # not return it, so resident memory ratcheted 1.79 -> 2.71 -> 2.91GB
      # between publications until the cgroup killed the process.  Capping the
      # arenas and trimming aggressively returns freed generations to the OS.
      MALLOC_ARENA_MAX: "2"
      MALLOC_TRIM_THRESHOLD_: "131072"
      SPREADBOARD_SERVICE_ROLE: "web"
      SPREADBOARD_DATA_DIR: /app/runtime
      SPREADBOARD_PUBLIC_MODE: "1"
      SPREADBOARD_AUTH_REQUIRED: "1"
      SPREADBOARD_PUBLIC_URL: "https://spreadarbitrage.ink"
      SPREADBOARD_LIGHTWEIGHT_MODE: "0"
      # Structural venue/listing discovery is intentionally slower than live
      # books and funding. Those continue every minute from the persisted full
      # catalogue; a deep discovery pass runs every two hours and keeps
      # serving the last complete generation while it works.
      SPREADBOARD_REFRESH_SECONDS: "7200"
      # A route is a current executable claim, not an archive row. Discovery
      # may take longer, but the bulk/fast quote workers keep healthy legs
      # moving continuously; anything untouched for five minutes leaves the
      # live board until it can be quoted again.
      SPREADBOARD_LIVE_MAX_AGE_MIN: "5"
      SPREADBOARD_REFRESH_TIMEOUT_SECONDS: "3600"
      SPREADBOARD_FAST_QUOTE_SECONDS: "60"
      # The complete CEX catalogue is repriced independently in one bulk pass.
      # This exact-route worker spends 90 rows on the rate-limited Futures-DEX
      # lane and one direct canary per CEX lane. Thirty leaders plus additional
      # contracts provide a failure buffer for thin, unavailable, or rejected
      # routes. Completed pairs publish incrementally, so early quotes never
      # wait for the last contract.
      SPREADBOARD_FAST_QUOTE_ROUTES: "93"
      # OKX Web3 is rate-limited. The current-board rotation requests only the
      # executable opening direction for each exact DEX leg, shares that quote
      # across paired routes, and keeps both DEX lanes inside the 90-second
      # current-spread boundary. Spot-DEX is not a public product. Full
      # two-sided probes remain available to explicit chart/detail sampling.
      SPREADBOARD_FAST_DEX_ROUTES: "90"
      # The selector counts directional provider quotes: buy and sell on the
      # same contract are different requests. Forty-five is only three calls
      # above the previously miscounted live workload (42), but allocates them
      # honestly and leaves Futures-DEX with a measured failure buffer.
      SPREADBOARD_FAST_DEX_CONTRACTS: "45"
      # The complete CEX catalogue is already refreshed independently. Reuse
      # only a depth-complete CEX book from the last 30 seconds while pairing
      # it with a new DEX quote. Its real timestamp is preserved and the mixed
      # route still expires at the strict 90-second leader boundary.
      SPREADBOARD_FAST_CEX_BOOK_AGE_SECONDS: "30"
      SPREADBOARD_FAST_QUOTE_WORKERS: "6"
      SPREADBOARD_DEX_QUOTE_CHUNK_SIZE: "8"
      SPREADBOARD_FAST_QUOTE_TIMEOUT_SECONDS: "300"
      # Heavy structural view generation runs in the background. A response is
      # served only from the current snapshot signature; live price pushes keep
      # that same generation moving between builds. Rebuilding all eleven views
      # every five minutes saturated both CPUs and made requests wait 50-78s.
      SPREADBOARD_WARM_INTERVAL_SECONDS: "900"
      # Principal pages are built by a nice/ionice child into an atomic,
      # persistent generation on the existing runtime volume. HTTP always
      # serves the last complete generation with current books/funding overlaid;
      # it never owns this CPU-heavy work and restarts do not make pages cold.
      SPREADBOARD_MATERIALIZED_VIEW_MIN_SECONDS: "900"
      SPREADBOARD_MATERIALIZED_VIEW_TIMEOUT_SECONDS: "1800"
      SPREADBOARD_TOKEN_RANKING_SECONDS: "120"
      # Live books still overlay every response immediately. Rebuilding the
      # entire structural/ranking cache on each 10-second quote generation held
      # the Python GIL continuously and stalled unrelated Account requests.
      SPREADBOARD_WEB_CACHE_INVALIDATION_SECONDS: "120"
      # Prices must move as the books move, not on a beat. The re-pricing is
      # shared between streams, so this is independent of how many people watch.
      SPREADBOARD_BOARD_STREAM_SECONDS: "0.25"
      SPREADBOARD_LIVE_TICK_SECONDS: "0.25"
      # Concurrent readers share one initial live-book overlay per cached view.
      # The SSE stream still takes over at 250ms after the HTML is delivered.
      SPREADBOARD_MARKET_FRESHNESS_SECONDS: "2"
      SPREADBOARD_RESULT_CACHE_SECONDS: "1200"
      # The complete navigation set now lives on the runtime volume, not in
      # Python RAM. Keep only the six most recently used decoded payloads; an
      # eviction reloads verified JSON and never rebuilds the market universe.
      # This leaves memory headroom for the isolated next-generation builder on
      # the unchanged 8GB host.
      SPREADBOARD_MARKET_CACHE_ENTRIES: "6"
      # Each structural build materialises the full live universe. Production
      # stack traces showed two at once while the cgroup was throttled, causing
      # intermittent page stalls and a rising memory tail. The previous
      # a second full build cannot overlap the first.
      SPREADBOARD_MARKET_BUILD_SLOTS: "1"
      # Readers do not wait through a 15-25 second cold generation. They get a
      # truthful preparing shell/export state quickly and retry the one
      # admitted current build; no second build or stale fallback is allowed.
      SPREADBOARD_MARKET_BUILD_WAIT_SECONDS: "5"
      SPREADBOARD_MARKET_BUILD_SLOT_WAIT_SECONDS: "1.5"
      # The web and collector already have separate cgroup ceilings and the web
      # receives eight times the collector's CPU share. An additional nice=8
      # penalty stretched otherwise 40-second quote passes to the full
      # 90-second truth boundary whenever a route-index build overlapped.
      # Keep live prices at normal priority inside the collector's own cgroup;
      # deep discovery/ranking/history workers remain nice=19.
      SPREADBOARD_LIVE_WORKER_NICE: "0"
      # One fetch_tickers per venue re-prices the full catalogue. Six bounded
      # independent venue calls give the production pass headroom inside the
      # 90-second truth boundary even while other warmers are active.
      # Three steady-state passes completed in 80.6-82.8 seconds. A five-second
      # breath keeps their start-to-start cadence below the 90-second route
      # boundary while avoiding a permanently tight worker loop.
      SPREADBOARD_BULK_QUOTE_SECONDS: "5"
      # One provider cannot hold every healthy venue beyond the 90-second live
      # truth boundary. Publish completed venue batches at 70 seconds and retry
      # any explicitly pending source on the next non-overlapping process.
      SPREADBOARD_BULK_QUOTE_BUDGET_SECONDS: "70"
      # The route artifact is structural. Both directions of every admitted
      # pair stay indexed while live books reprice them every few seconds. A
      # bounded two-minute rebuild now also merges partial venue generations
      # into that retained structure, so a newly quoteable CEX pair does not
      # wait for a rare perfect sweep or a five-minute cadence. Foreground
      # books retain the unchanged 90-second current-opportunity expiry.
      SPREADBOARD_LIVE_ROUTE_INDEX_REFRESH_SECONDS: "120"
      # Spot and mixed Spot/Futures venues finish their independent quote
      # writes at different times. Alternate those compact projections between
      # full 30-second passes so real overlaps are observed without extending
      # the 90-second expiry.
      SPREADBOARD_PRIORITY_LIVE_QUERY_REFRESH_SECONDS: "5"
      # Independent venue adapters refresh concurrently; each venue writes its
      # result in one SQLite transaction. Production passes had grown to
      # 91-98s at eight/twelve workers, outside the unchanged 90s truth
      # boundary. One bounded worker per independent venue measured ~38s and
      # does not extend quote lifetime or overlap complete sweeps.
      SPREADBOARD_BULK_QUOTE_WORKERS: "24"
      # Funding has its own isolated worker. A slow funding provider must never
      # postpone a current-price pass or make a valid spread disappear.
      SPREADBOARD_BULK_FUNDING_SECONDS: "30"
      SPREADBOARD_BULK_FUNDING_TIMEOUT_SECONDS: "240"
      # Funding is rotated in four-venue slices and merged atomically.
      SPREADBOARD_FUNDING_VENUES_PER_PASS: "4"
      # A provider failure may keep the last good rate through one rotation,
      # but never indefinitely. The reader independently enforces this age.
      SPREADBOARD_FUNDING_MAX_AGE_SECONDS: "600"
      SPREADBOARD_VENUE_HISTORY_PRIORITY_SECONDS: "300"
      # While the exact settlement archive is incomplete, give it a bounded
      # five-minute start-to-start catch-up pass. Completed catalog legs retain
      # the three-hour maintenance gate inside the worker.
      SPREADBOARD_MARKET_EVIDENCE_SECONDS: "300"
      # Complete token pages read the shared catalogue, not the capped scanner.
      # The bound matches a measured whole-catalogue quote rotation.
      SPREADBOARD_CATALOG_BOOK_AGE_SECONDS: "180"
      # A five-minute-old book can turn a converged 0.08% route into a false
      # 10% headline. Only genuinely live books may override the snapshot.
      # Readers consume the complete current quote generation. Individual
      # routes still expire at the unchanged 90-second leader boundary below.
      SPREADBOARD_LIVE_BOOK_AGE_SECONDS: "90"
      # Websockets are only the fast lane for currently visible routes; the
      # one-call-per-venue bulk worker covers the complete catalogue. Hundreds
      # of concurrent CCXT subscriptions consumed a full CPU and more than 1GB
      # while repeatedly reconnecting. The lane reserver still gives each view
      # first access to this bounded live set.
      SPREADBOARD_WS_BOOKS: "96"
      # Search/history rows remain available for five minutes, but a spread
      # older than this cannot headline a current ranking. Funding is ranked
      # independently and is not suppressed by this basis-age boundary.
      SPREADBOARD_SPREAD_LEADER_MAX_AGE_SECONDS: "90"
      SPREADBOARD_WS_RECONCILE_SECONDS: "10"
      SPREADBOARD_WS_WRITE_SECONDS: "0.25"
      SPREADBOARD_CHART_SAMPLE_SECONDS: "2"
      SPREADBOARD_CHART_STREAM_SECONDS: "2"
      SPREADBOARD_CHART_SAMPLE_TIMEOUT_SECONDS: "22"
      SPREADBOARD_CHART_SAMPLE_CONCURRENCY: "4"
      SPREADBOARD_CHART_CATALOG_WORKERS: "4"
      SPREADBOARD_CHART_CATALOG_SECONDS: "21600"
      SPREADBOARD_CHART_CATALOG_VENUE_TIMEOUT: "60"
      SPREADBOARD_POSITION_ALERT_SECONDS: "2"
      SPREADBOARD_ACCOUNTING_PUBLIC_KEY_FILE: /run/secrets/accounting-public.pem
      SPREADBOARD_MARKET_ALERT_SECONDS: "2"
      # Rail reopen transitions are retained for diagnostics but never posted
      # to the shared subscriber group unless an operator explicitly opts in.
      SPREADBOARD_RAIL_TELEGRAM_GROUP: "0"
      SPREADBOARD_RAIL_REOPEN_COOLDOWN_SECONDS: "86400"
      SPREADBOARD_TELEGRAM_MEMBERSHIP_SECONDS: "60"
      SPREADBOARD_CEX_CANDIDATES: "550"
      SPREADARB_MIN_SPREAD_PCT: "0.05"
      # A token quoted on many venues yields far more directed pairs than this.
      # At 28 the snapshot held 22,111 rows against a 30,000 budget, so the cap
      # -- not the budget -- was dropping real routes: SKHYNIX carries both a
      # Kucoin-futures and a Bybit-futures leg, yet kucoin->bybit was cut, which
      # is one of the three exact pairs the UACryptoInvest comparator reports as
      # missing at 94% recall.
      #
      # Raising this is safe for breadth because the snapshot trim is
      # budget-aware: it lowers the per-token allowance until the whole set fits
      # and never drops a token below one route. That is what makes a naive
      # increase (the cap once went to 90) different from this one -- back then
      # the trim was a plain slice and the board fell from 1,637 tokens to 777.
      # TRIED AND REVERTED 2026-08-29: raising this to 40 worked exactly as
      # intended for coverage -- the snapshot went 21,305 -> 28,224 rows, the
      # per-token max reached 40, and SKHYNIX kucoin->bybit (one of the three
      # comparator absences at 94% recall) appeared. It also took the site down.
      # The extra 32% of rows pushed the collector past its 4GiB cgroup: two
      # OOM kills, the web app restarted, and /api/health served 502.
      #
      # Coverage here is memory-bound, not logic-bound. Do not raise it again
      # until the collector has real headroom -- see the capacity note in
      # REMINDERS.md (steady base ~2.2GB plus a ~2GB child in 4GiB, on a host
      # already committing 8.44GB of 7.94GB).
      # 2026-08-31: 28 -> 32. The 28 -> 40 attempt on 2026-08-29 OOM-killed the
      # collector and 502'd the site, but the conditions that made it fail have
      # since changed: complete_funding_catalog.json is down from 523MB to
      # 178MB, the live-route-index build no longer holds two generations at
      # once, and one-leg-per-venue removed the duplicate expansions. The
      # collector now peaks at 3,392MB of 4,096MB.
      #
      # Sized deliberately small: 630 tokens sit at the cap, so this adds at
      # most ~2,520 rows (22,388 -> ~24,908, +11%) and stays under the 30,000
      # SPREADBOARD_DISCOVERY_ROWS ceiling. The failed attempt was +32%.
      # Revert to 28 if the collector shows any oom_kill.
      SPREADARB_MAX_ROWS_PER_TOKEN: "32"
      SPREADARB_MAX_SNAPSHOT_ROWS_PER_TOKEN: "32"
      SPREADARB_MIN_FUNDING_APR_PCT: "0.01"
      SPREADBOARD_DISCOVERY_ROWS: "30000"
      SPREADBOARD_DEX_CANDIDATES: "450"
      SPREADBOARD_DEX_SPOT_TIMEOUT_SECONDS: "420"
      # 2026-08-31: 150 -> 250, the ceiling the code itself enforces
      # (min(250, env) in sources.py). This is the largest remaining source of
      # comparator absences: UACryptoInvest pairs a BinanceAlpha spot leg
      # against a CEX future, and of the tokens it samples there, five of seven
      # -- IN, TRIA, AIXBT, MARSCOIN, FOLKS -- have plenty of CEX routes here
      # and NO on-chain leg at all, because they are not in this scan set.
      #
      # It costs no quota. OKX's rate limit is respected by
      # SPREADBOARD_OKX_DEX_MIN_INTERVAL_S below; more tokens make the pass
      # LONGER, not faster. A two-sided 150-token pass runs about three
      # minutes, so 250 lands near five, inside the 420s
      # SPREADBOARD_DEX_SPOT_TIMEOUT_SECONDS. Watch for
      # "dex spot" timeouts and drop back to 150 if the pass stops completing.
      # REVERTED 2026-08-31: 250 delivered NO coverage -- dex_tokens stayed at
      # 161 for 45 minutes and none of IN/TRIA/AIXBT/MARSCOIN/FOLKS gained an
      # on-chain leg -- while the collector took 7 OOM kills, the web app
      # restarted 5 times and the site served one 502. Zero benefit, real cost.
      #
      # The budget is NOT what keeps those tokens out. Selection ranks
      # candidates by projected funding, so raising the ceiling only admits
      # more of the same ranking; whatever excludes these tokens happens
      # earlier. Find that before touching this number again.
      SPREADBOARD_OKX_DEX_DYNAMIC_TOKENS: "150"
      # The connected project is visibly on OKX's Startup plan (minimum 2
      # RPS). Stay below that ceiling while cutting a two-sided 150-contract
      # quote pass from about six minutes to about three. Provider 429s still
      # back off and retry; free mode still stops on HTTP 402 and cannot pay.
      SPREADBOARD_OKX_DEX_MIN_INTERVAL_S: "0.55"
      SPREADBOARD_FUNDING_HISTORY_WORKERS: "14"
      # Concurrency for the settled-funding history sweep. A window fails
      # closed at its next settlement, so holding the 1d/7d/30d columns means
      # refreshing every futures leg on the board every 4-8 hours. Serially
      # that measured 285 legs/hour against the ~1,175 needed; batched and
      # spread across venues it reaches ~1,200. Real parallelism is bounded by
      # FUNDING_HISTORY_PER_VENUE (2), which is what protects a venue from a
      # rate-limit ban -- this number only widens how many DIFFERENT venues are
      # in flight. Measured at this setting: 4.2% non-ok responses.
      SPREADBOARD_FUNDING_HISTORY_FETCH_WORKERS: "20"
      # Settled funding needs one history call per futures leg -- no venue
      # offers it in bulk -- so it cannot cover the whole board. At 25 tokens a
      # lane only 181 of 15,754 rows were settled and the rest were projections
      # from the current rate. 90 covers the routes people actually take.
      SPREADBOARD_FUNDING_TOKENS_PER_LANE: "90"
      SPREADBOARD_NATIVE_FUNDING_ONLY: "1"
      SPREADARB_MAX_ENTRY_SPREAD_PCT: "0"
    volumes:
      - /opt/spreadboard/runtime:/app/runtime
      - /opt/spreadboard/secrets/accounting-public.pem:/run/secrets/accounting-public.pem:ro
    expose:
      - "8200"
    networks:
      - backend
    init: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    # This process now owns HTTP, user lifecycle and the bounded view caches;
    # exchange clients and discovery allocations live in the collector cgroup.
    # The limit retains a measured cache-generation peak plus request headroom.
    mem_limit: 3584m
    # The current Droplet has four vCPUs. This is a ceiling, not a reservation;
    # the higher CPU share below makes subscriber work win when both roles run.
    cpus: 3.6
    # Subscriber HTTP, payments and lifecycle work retain a 4:1 scheduling
    # advantage over collection. The former 8:1 split let a busy browser audit
    # stretch otherwise 40-65s quote passes to the 90s truth boundary, causing
    # current CEX lanes to disappear while the underlying books were healthy.
    cpu_shares: 2048
    logging:
      driver: json-file
      options:
        max-size: 20m
        max-file: "5"

  collector:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      # Contains only market-source credentials (currently OKX DEX and the
      # read-only venue keys used for deposit/withdrawal rail evidence). It
      # deliberately excludes billing, Telegram, email, push and field keys.
      - ${SPREADBOARD_COLLECTOR_ENV_FILE:-/opt/spreadboard/secrets/collector.env}
    environment:
      <<: *spreadboard_runtime_environment
      SPREADBOARD_SERVICE_ROLE: "collector"
      SPREADBOARD_DISABLE_LOCAL_CACHE_WARM: "1"
      # Slow settled-history/radar publication runs in an isolated low-priority
      # worker after startup, never in the HTTP process or collector parent.
      # The persisted catalogue and live quote workers are available at
      # restart. Repair exact settlement windows before any due deep structural
      # discovery takes the collector's heavy-work lock.
      # Current all-venue books and their route index are the user-facing
      # truth boundary.  Give the first quote+route publication the heavy
      # worker slot before starting the slower historical evidence catch-up.
      SPREADBOARD_MARKET_EVIDENCE_INITIAL_DELAY_SECONDS: "120"
      SPREADBOARD_STARTUP_EVIDENCE_WAIT_SECONDS: "600"
      # Structural discovery is deliberately broad and can span long venue and
      # OKX DEX cycles. Live truth has separate book/generation and exact-chain
      # quote gates; the structural universe must still advance within 72h.
      SPREADBOARD_COLLECTOR_SNAPSHOT_MAX_AGE_SECONDS: "259200"
    command: ["/app/.venv/bin/python", "scripts/run_spreadboard_service.py"]
    healthcheck:
      test: ["CMD", "/app/.venv/bin/python", "scripts/collector_healthcheck.py"]
      interval: 30s
      timeout: 10s
      start_period: 600s
      retries: 3
    volumes:
      - /opt/spreadboard/runtime:/app/runtime
    networks:
      - backend
    init: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 4g
    # This service is memory-bound, not CPU-bound, and the two are coupled:
    # cores it does not have to wait for become concurrent work in flight, and
    # concurrent work here is held in RAM. Measured on the four-vCPU Droplet --
    #   cpus 2.0 -> 2.4GiB steady
    #   cpus 3.2 -> 3.98GiB of a 4GiB cap, anon (not page cache), with
    #               memory.events max=1827, i.e. allocation stalling against
    #               the limit 1827 times with almost no file cache to reclaim
    # It had not been OOM-killed yet, but only because reclaim was still just
    # winning, and the earlier OOM here took every scan down with it.
    #
    # 2.4 is the largest safe ceiling for continuously live collection inside
    # 4GiB. Subscriber navigation is now isolated from this work through the
    # persistent materialized-view handoff, so no server resize is required.
    cpus: 2.4
    cpu_shares: 512
    logging:
      driver: json-file
      options:
        max-size: 20m
        max-file: "5"

  accounting-worker:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    environment:
      SPREADBOARD_DATA_DIR: /app/runtime
      SPREADBOARD_ACCOUNTING_PRIVATE_KEY_FILE: /run/secrets/accounting-private.pem
    command: ["/app/.venv/bin/python", "scripts/accounting_worker.py", "--interval", "300"]
    group_add:
      - "1000"
    healthcheck:
      test: ["CMD", "/app/.venv/bin/python", "-c", "import json,time; from pathlib import Path; d=json.loads(Path('/app/runtime/accounting_worker_status.json').read_text()); stamp=str(d.get('generated_at') or '').replace('Z','+00:00'); from datetime import datetime; assert time.time()-datetime.fromisoformat(stamp).timestamp()<900"]
      interval: 60s
      timeout: 10s
      start_period: 90s
      retries: 3
    volumes:
      - /opt/spreadboard/runtime:/app/runtime
      - /opt/spreadboard/secrets/accounting-private.pem:/run/secrets/accounting-private.pem:ro
    networks:
      - backend
    init: true
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 768m
    cpus: 0.6
    logging:
      driver: json-file
      options:
        max-size: 5m
        max-file: "3"

  caddy:
    image: caddy:2.10.2-alpine
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - backend
    security_opt:
      - no-new-privileges:true
    mem_limit: 192m
    cpus: 0.2
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

networks:
  backend:
    driver: bridge

volumes:
  caddy_data:
  caddy_config:
