services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - ${SPREADBOARD_ENV_FILE:-/opt/spreadboard/secrets/app.env}
    environment:
      HOST: 0.0.0.0
      PORT: "8200"
      SPREADBOARD_DATA_DIR: /app/runtime
      SPREADBOARD_PUBLIC_MODE: "1"
      SPREADBOARD_LIGHTWEIGHT_MODE: "0"
      SPREADBOARD_REFRESH_SECONDS: "300"
      SPREADBOARD_REFRESH_TIMEOUT_SECONDS: "900"
      SPREADBOARD_FAST_QUOTE_SECONDS: "20"
      SPREADBOARD_FAST_QUOTE_ROUTES: "100"
      SPREADBOARD_FAST_QUOTE_TIMEOUT_SECONDS: "240"
      SPREADBOARD_CHART_SAMPLE_SECONDS: "2"
      SPREADBOARD_CHART_STREAM_SECONDS: "2"
      SPREADBOARD_CHART_SAMPLE_TIMEOUT_SECONDS: "22"
      SPREADBOARD_CHART_SAMPLE_CONCURRENCY: "4"
      SPREADBOARD_CEX_CANDIDATES: "150"
      SPREADBOARD_DISCOVERY_ROWS: "1200"
      SPREADBOARD_DEX_CANDIDATES: "60"
      SPREADBOARD_DEX_SPOT_TIMEOUT_SECONDS: "240"
      SPREADBOARD_OKX_DEX_DYNAMIC_TOKENS: "50"
      SPREADBOARD_FUNDING_HISTORY_WORKERS: "12"
      SPREADBOARD_NATIVE_FUNDING_ONLY: "1"
      SPREADARB_MAX_ENTRY_SPREAD_PCT: "0"
    volumes:
      - /opt/spreadboard/runtime:/app/runtime
    expose:
      - "8200"
    networks:
      - backend
    init: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 3g
    cpus: 1.8
    logging:
      driver: json-file
      options:
        max-size: 20m
        max-file: "5"

  caddy:
    image: caddy:2.10.2-alpine
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - backend
    security_opt:
      - no-new-privileges:true
    mem_limit: 192m
    cpus: 0.2
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

networks:
  backend:
    driver: bridge

volumes:
  caddy_data:
  caddy_config:
