services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - ${SPREADBOARD_ENV_FILE:-/opt/spreadboard/secrets/app.env}
    environment:
      HOST: 0.0.0.0
      PORT: "8200"
      SPREADBOARD_DATA_DIR: /app/runtime
      SPREADBOARD_PUBLIC_MODE: "1"
      SPREADBOARD_AUTH_REQUIRED: "1"
      SPREADBOARD_PUBLIC_URL: "https://spreadarbitrage.ink"
      SPREADBOARD_LIGHTWEIGHT_MODE: "0"
      SPREADBOARD_REFRESH_SECONDS: "1500"
      # A route is a current executable claim, not an archive row. Discovery
      # may take longer, but the bulk/fast quote workers keep healthy legs
      # moving continuously; anything untouched for five minutes leaves the
      # live board until it can be quoted again.
      SPREADBOARD_LIVE_MAX_AGE_MIN: "5"
      SPREADBOARD_REFRESH_TIMEOUT_SECONDS: "2700"
      SPREADBOARD_FAST_QUOTE_SECONDS: "60"
      # Forty exact candidates per primary lane leaves enough headroom for
      # venue failures while still halving the old 320-route cycle.
      SPREADBOARD_FAST_QUOTE_ROUTES: "160"
      SPREADBOARD_FAST_QUOTE_TIMEOUT_SECONDS: "240"
      # Prices must move as the books move, not on a beat. The re-pricing is
      # shared between streams, so this is independent of how many people watch.
      SPREADBOARD_BOARD_STREAM_SECONDS: "0.25"
      SPREADBOARD_LIVE_TICK_SECONDS: "0.25"
      SPREADBOARD_RESULT_CACHE_SECONDS: "1200"
      # Thirteen warmed views plus headroom for ad-hoc queries. Measured, the
      # whole warm set costs ~471MB: the first build is +210MB and the charts
      # view at limit=500 is +83MB, while every lane query after them adds
      # 0-8MB because they share the parsed snapshot. The bound exists to stop
      # ordinary traffic evicting what the warmer just built and to cap the
      # tail -- it is applied twice, to _MARKET_CACHE and to the
      # stale-while-revalidate copy behind it.
      # The warmer builds 11 views; 20 left ~9 tail entries churning on a box
      # whose ceiling is 6g and which peaked at 5.1g. This is the code default
      # and still holds every warmed view resident.
      SPREADBOARD_MARKET_CACHE_ENTRIES: "14"
      # One fetch_tickers per venue re-prices the whole board. This is what
      # makes every positive token current rather than only the streamed ones.
      SPREADBOARD_BULK_QUOTE_SECONDS: "15"
      # A five-minute-old book can turn a converged 0.08% route into a false
      # 10% headline. Only genuinely live books may override the snapshot.
      SPREADBOARD_LIVE_BOOK_AGE_SECONDS: "10"
      SPREADBOARD_WS_BOOKS: "1100"
      SPREADBOARD_WS_RECONCILE_SECONDS: "10"
      SPREADBOARD_WS_WRITE_SECONDS: "0.25"
      SPREADBOARD_CHART_SAMPLE_SECONDS: "2"
      SPREADBOARD_CHART_STREAM_SECONDS: "2"
      SPREADBOARD_CHART_SAMPLE_TIMEOUT_SECONDS: "22"
      SPREADBOARD_CHART_SAMPLE_CONCURRENCY: "4"
      SPREADBOARD_CHART_CATALOG_WORKERS: "4"
      SPREADBOARD_CHART_CATALOG_SECONDS: "21600"
      SPREADBOARD_CHART_CATALOG_VENUE_TIMEOUT: "60"
      SPREADBOARD_POSITION_ALERT_SECONDS: "30"
      SPREADBOARD_MARKET_ALERT_SECONDS: "10"
      SPREADBOARD_TELEGRAM_MEMBERSHIP_SECONDS: "60"
      SPREADBOARD_CEX_CANDIDATES: "550"
      SPREADARB_MIN_SPREAD_PCT: "0.05"
      SPREADARB_MAX_ROWS_PER_TOKEN: "28"
      SPREADARB_MAX_SNAPSHOT_ROWS_PER_TOKEN: "28"
      SPREADARB_MIN_FUNDING_APR_PCT: "0.01"
      SPREADBOARD_DISCOVERY_ROWS: "30000"
      SPREADBOARD_DEX_CANDIDATES: "450"
      SPREADBOARD_DEX_SPOT_TIMEOUT_SECONDS: "420"
      SPREADBOARD_OKX_DEX_DYNAMIC_TOKENS: "150"
      SPREADBOARD_FUNDING_HISTORY_WORKERS: "14"
      # Settled funding needs one history call per futures leg -- no venue
      # offers it in bulk -- so it cannot cover the whole board. At 25 tokens a
      # lane only 181 of 15,754 rows were settled and the rest were projections
      # from the current rate. 90 covers the routes people actually take.
      SPREADBOARD_FUNDING_TOKENS_PER_LANE: "90"
      SPREADBOARD_NATIVE_FUNDING_ONLY: "1"
      SPREADARB_MAX_ENTRY_SPREAD_PCT: "0"
    volumes:
      - /opt/spreadboard/runtime:/app/runtime
    expose:
      - "8200"
    networks:
      - backend
    init: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    # The box has 8GB; this stayed at 3g from when it had 4. The scan reaches
    # ~1.6GB RSS on its own, so the container total crossed the cgroup limit and
    # the kernel killed it 18 times in four hours -- which is why no discovery
    # scan finished, why the container restarted five times, and why the board
    # went blank mid-session. 6g leaves room for Caddy and the host.
    mem_limit: 6g
    cpus: 1.8
    logging:
      driver: json-file
      options:
        max-size: 20m
        max-file: "5"

  caddy:
    image: caddy:2.10.2-alpine
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - backend
    security_opt:
      - no-new-privileges:true
    mem_limit: 192m
    cpus: 0.2
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

networks:
  backend:
    driver: bridge

volumes:
  caddy_data:
  caddy_config:
