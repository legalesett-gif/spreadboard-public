name: Lint ratchet

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lint-ratchet-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ruff-ratchet:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6

      - name: Install Ruff
        # Pinned so a new Ruff release cannot fail the build on findings that
        # did not exist when the baseline was frozen.
        run: pipx install ruff==0.16.3

      - name: Fail only on new findings
        run: python3 scripts/ruff_ratchet.py
